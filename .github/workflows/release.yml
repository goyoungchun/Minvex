name: Minvex release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        type: string
        required: true
        default: v1.2.1
      verify_existing:
        description: Verify archives from this revision for an existing release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_SOURCE: ${{ inputs.verify_existing && github.sha || inputs.tag || github.ref_name }}
  VERIFY_EXISTING: ${{ inputs.verify_existing }}
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SOURCE }}
          fetch-depth: ${{ inputs.verify_existing && '0' || '1' }}
      - name: Verify tagged source and native architecture
        shell: pwsh
        run: |
          if ($IsMacOS -and (uname -m) -ne 'arm64') { throw 'macOS release requires native arm64.' }
          if ($env:VERIFY_EXISTING -eq 'true') {
            git merge-base --is-ancestor "refs/tags/$env:RELEASE_TAG" HEAD
            if ($LASTEXITCODE -ne 0) { throw 'The verification revision must descend from the release tag.' }
          }
          cmake "-DRELEASE_TAG=$env:RELEASE_TAG" -P cmake/VerifyReleaseVersion.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $options = @('-S', '.', '-B', 'out/release', '-DCMAKE_BUILD_TYPE=Release', '-DBUILD_TESTING=ON', '-DMINVEX_INSTALL_DOCS=ON')
          if ($IsMacOS) { $options += @('-DCMAKE_OSX_ARCHITECTURES=arm64', '-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0') }
          else { $options += @('-A', 'x64') }
          cmake @options
          exit $LASTEXITCODE
      - name: Build release SDK
        run: cmake --build out/release --config Release --parallel 4
      - name: Check CPU API contracts
        run: ctest --test-dir out/release -C Release --parallel 4 --no-tests=error --output-on-failure
      - name: Verify package checksum, relocation and independent consumers
        run: cmake -DBUILD_DIR=out/release -DCONFIG=Release -DPACKAGE=ON -DVERIFY_KOREAN_NINJA=${{ runner.os == 'Windows' }} -P cmake/VerifySdk.cmake
      - name: Retain SDK archives
        uses: actions/upload-artifact@v7
        with:
          name: Minvex-${{ runner.os }}-${{ runner.arch }}
          path: |
            out/release/sdk-check-*/packages/*.zip
            out/release/sdk-check-*/packages/*.tar.gz
            out/release/sdk-check-*/packages/*.sha256
          if-no-files-found: error
  publish:
    needs: sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          pattern: Minvex-*
          path: release-assets
          merge-multiple: true
      - name: Verify archives and publish new releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t release_assets < <(find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -print0)
          test "${#release_assets[@]}" -eq 4
          while IFS= read -r -d '' checksum; do
            (cd "$(dirname "$checksum")" && sha256sum --check "$(basename "$checksum")")
          done < <(find release-assets -type f -name '*.sha256' -print0)
          if [[ "$VERIFY_EXISTING" == true ]]; then
            gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -x false
            exit 0
          fi
          cat > release-notes.txt <<'NOTES'
          Minvex is a lightweight C++20 graphics SDK for Windows x64 / D3D11 and macOS 14+ / Apple Silicon arm64 / Metal.

          Includes model import, scenes, skeletal and morph animation, particles, PBR materials, lighting and shadows, screen UI, Standalone Viewer, Embedded rendering and Editor document APIs.

          Native SDK archives contain static libraries, public headers, CMake package configuration, consumer examples, API documentation and dependency notices. Use a matching architecture, compiler, build configuration and C++ runtime. SHA-256 files accompany each archive. Python and Web bindings can be built from source and are not included in these native archives.

          The Windows archive filename includes the required MSVC compiler major.minor (for example, MSVC-19.51). Check your compiler with cl /Bv. If the versions differ, select the matching MSVC toolset or build the SDK from this release tag with your compiler.

          New in 1.2.1

          - Configure Standalone Viewer GPU resource pool sizes. Compatible mesh primitives share shaders and pipelines, and consecutive draws reuse pipeline state.
          - Inspect the actual particle path, CPU fallback reason and submitted count for each emitter. Toggle emitters and sub-emitter event routes while live particles continue their simulation.
          - Add a camera-centered equirectangular panorama and render alpha-blended mesh materials, including glTF BLEND assets.
          - Use persistent Scene object keys to reconnect after loading, and store application strings in object metadata.
          - Inspect UI rasterization and upload costs. Text updates can upload only changed regions, and Standalone Viewer uses the platform's frame scheduling facilities to pace capped rendering.

          Build minvex_editor from the source tag to use the Editor application. The particle example is in share/minvex/examples/Particles.

          The examples are in share/minvex/examples/QuickStart.

          The SDK reads Scene v1 through v17. Scenes use v13 by default, v14 for embedded terrain, v15 for basic particle effects, v16 for advanced particle modules, and v17 for persistent object keys, metadata or alpha-blended material overrides. Scenes saved as v17 require a v17 reader. Keep referenced meshes and PNGs with the scene and rebuild C++ consumers using the headers and libraries from the same SDK package.

          Building from source requires a C++20 standard library with std::jthread and std::stop_token. Each binary SDK records its compiler and runtime in share/minvex/sdk-manifest.json.

          The macOS binary targets Apple Silicon. Frame cadence depends on the device, scene, window visibility, OS scheduling and display callbacks. Low quality at 720p and 30 FPS is a performance target on minimum hardware.

          License: Apache-2.0. Bundled dependencies retain their own licenses; see LICENSE, NOTICE and share/minvex/licenses.
          NOTES
          release_flags=()
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then release_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${release_assets[@]}" --verify-tag \
            --title "Minvex $RELEASE_TAG" --notes-file release-notes.txt "${release_flags[@]}"
