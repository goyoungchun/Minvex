name: Minvex release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        type: string
        required: true
        default: v1.0.2
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify tagged source and native architecture
        shell: pwsh
        run: |
          if ($IsMacOS -and (uname -m) -ne 'arm64') { throw 'macOS release requires native arm64.' }
          cmake "-DRELEASE_TAG=$env:RELEASE_TAG" -P cmake/VerifyReleaseVersion.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $options = @('-S', '.', '-B', 'out/release', '-DCMAKE_BUILD_TYPE=Release', '-DBUILD_TESTING=ON', '-DMINVEX_INSTALL_DOCS=ON')
          if ($IsMacOS) { $options += @('-DCMAKE_OSX_ARCHITECTURES=arm64', '-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0') }
          else { $options += @('-A', 'x64') }
          cmake @options
          exit $LASTEXITCODE
      - name: Build release SDK
        run: cmake --build out/release --config Release --parallel 4
      - name: Check CPU API contracts
        run: ctest --test-dir out/release -C Release --parallel 4 --no-tests=error --output-on-failure
      - name: Verify package checksum, relocation and independent consumers
        run: cmake -DBUILD_DIR=out/release -DCONFIG=Release -DPACKAGE=ON -P cmake/VerifySdk.cmake
      - name: Retain SDK archives
        uses: actions/upload-artifact@v7
        with:
          name: Minvex-${{ runner.os }}-${{ runner.arch }}
          path: |
            out/release/sdk-check-*/packages/*.zip
            out/release/sdk-check-*/packages/*.tar.gz
            out/release/sdk-check-*/packages/*.sha256
          if-no-files-found: error
  publish:
    needs: sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          pattern: Minvex-*
          path: release-assets
          merge-multiple: true
      - name: Publish native C++ SDKs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t release_assets < <(find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -print0)
          test "${#release_assets[@]}" -eq 4
          while IFS= read -r -d '' checksum; do
            (cd "$(dirname "$checksum")" && sha256sum --check "$(basename "$checksum")")
          done < <(find release-assets -type f -name '*.sha256' -print0)
          cat > release-notes.txt <<'NOTES'
          Minvex is a lightweight C++20 graphics SDK for Windows x64 / D3D11 and macOS 14+ / Apple Silicon arm64 / Metal.

          Includes model import, scenes, skeletal and morph animation, PBR materials, lighting and shadows, screen UI, Standalone Viewer, Embedded rendering and Editor document APIs.

          Native SDK archives contain static libraries, public headers, CMake package configuration, consumer examples, API documentation and dependency notices. Use a matching architecture, compiler, build configuration and C++ runtime. SHA-256 files accompany each archive. Python and Web bindings can be built from source and are not included in these native archives.

          The Windows archive filename includes the required MSVC compiler major.minor (for example, MSVC-19.51). Check your compiler with cl /Bv. If the versions differ, select the matching MSVC toolset or build the SDK from this release tag with your compiler.

          Start with share/minvex/examples/QuickStart to load a model or build and control a scene from generated meshes.

          UiCanvas::SetRuntimeText updates live labels without changing saved UI or edit history. The Web source build accepts C++ scene initialization, frame and command callbacks so a procedural scene can be shared with the native Viewer.

          Building from source requires a C++20 standard library with std::jthread and std::stop_token. Each binary SDK records its compiler and runtime in share/minvex/sdk-manifest.json.

          Known limitation: intermittent long display frames have been observed on macOS. Frame cadence depends on window visibility, OS scheduling and display callbacks; disabling VSync does not guarantee an unlimited callback rate. A fixed maximum frame time is not guaranteed. Intel Mac binaries are not included.

          License: Apache-2.0. Bundled dependencies retain their own licenses; see LICENSE, NOTICE and share/minvex/licenses.
          NOTES
          release_flags=()
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then release_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${release_assets[@]}" --verify-tag \
            --title "Minvex $RELEASE_TAG" --notes-file release-notes.txt "${release_flags[@]}"
