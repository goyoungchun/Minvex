name: Minvex release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Source version to verify
        type: string
        required: true
        default: '1.0.0'
      macos_gpu:
        description: Run desktop checks on a configured Apple Silicon GPU runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify release metadata and vendored sources
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: cmake "-DEXPECTED_VERSION=$env:EXPECTED_VERSION" -P cmake/VerifyReleaseVersion.cmake
        shell: pwsh
      - name: Configure the official SDK architecture
        shell: pwsh
        run: |
          $options = @('-S', '.', '-B', 'out/release', '-DBUILD_TESTING=ON', '-DCMAKE_BUILD_TYPE=Release')
          if ($IsMacOS) {
            if ((uname -m) -ne 'arm64') { throw 'Official macOS SDK requires an Apple Silicon host.' }
            $options += '-DCMAKE_OSX_ARCHITECTURES=arm64'
          } else { $options += @('-A', 'x64') }
          cmake @options
          exit $LASTEXITCODE
      - name: Build SDK and shaders
        run: cmake --build out/release --config Release --parallel 4
      - name: Run CPU contracts
        run: ctest --test-dir out/release -C Release --output-on-failure --output-junit release-cpu.xml
      - name: Verify real archive, relocation and consumers
        run: cmake -DBUILD_DIR=out/release -DCONFIG=Release -DPACKAGE=ON -P cmake/VerifySdk.cmake
      - name: Retain candidate SDKs and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Minvex-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}-candidate
          path: |
            out/release/sdk-check-*/packages/*
            out/release/release-cpu.xml
          if-no-files-found: error
  macos-gpu:
    if: ${{ inputs.macos_gpu }}
    runs-on: [self-hosted, macOS, ARM64, minvex-gpu]
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      BUILD_CONFIGURATION: ${{ matrix.configuration }}
    steps:
      - uses: actions/checkout@v6
      - name: Check native architecture and metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cmake "-DEXPECTED_VERSION=$EXPECTED_VERSION" -P cmake/VerifyReleaseVersion.cmake
      - name: Configure desktop and native pixel checks
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "out/gpu-$BUILD_CONFIGURATION" -G Ninja \
            "-DCMAKE_BUILD_TYPE=$BUILD_CONFIGURATION" -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_TESTING=ON -DMINVEX_ENABLE_RENDER_SMOKE_TEST=ON \
            -DMINVEX_ENABLE_EXTENDED_TESTS=ON -DMINVEX_BUILD_BENCHMARKS=ON
          cmake --build "out/gpu-$BUILD_CONFIGURATION" --parallel 4
      - name: Run desktop checks serially with Metal validation
        shell: bash
        env:
          MTL_DEBUG_LAYER: '1'
          MTL_SHADER_VALIDATION: '1'
          MTL_SHADER_VALIDATION_REPORT_TO_STDERR: '1'
          MTL_SHADER_VALIDATION_ABORT_ON_FAULT: '1'
        run: |
          set -euo pipefail
          ctest --test-dir "out/gpu-$BUILD_CONFIGURATION" -N > "out/gpu-$BUILD_CONFIGURATION/registered-tests.txt"
          for required in lighting.pixels optimization.gpu ui.pixels native.lifecycle integration.embedded; do
            grep -Fq ": $required" "out/gpu-$BUILD_CONFIGURATION/registered-tests.txt"
          done
          ctest --test-dir "out/gpu-$BUILD_CONFIGURATION" --parallel 1 --output-on-failure \
            --output-junit desktop-results.xml
      - name: Retain desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Minvex-Metal-${{ matrix.configuration }}-${{ github.sha }}
          path: |
            out/gpu-*/registered-tests.txt
            out/gpu-*/desktop-results.xml
            out/gpu-*/Testing/Temporary/LastTest.log
          if-no-files-found: error
